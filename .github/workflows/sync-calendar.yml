name: Sync Airbnb Calendar

on:
  schedule:
    # Ogni 6 ore. Airbnb rigenera il suo iCal circa ogni 3 ore:
    # sotto le 4-6 ore non si guadagna freschezza reale.
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Serve per il commit del file e per pubblicare su Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Evita che questo workflow e quello di deploy pubblichino insieme.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Aggiorna le date da Airbnb
        env:
          TZ: UTC
          CALENDAR_KEY: ${{ secrets.CALENDAR_KEY }}
        run: node scripts/sync-calendar.js

      - name: Commit del file se e' cambiato
        id: commit
        run: |
          if git diff --quiet -- public/availability.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nessuna modifica da pubblicare."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/availability.json
            git commit -m "chore: aggiorna disponibilita da Airbnb"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Il push fatto con GITHUB_TOKEN non fa partire altri workflow,
      # quindi la pubblicazione la facciamo qui.
      - name: Build
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Si pubblica solo se le date sono davvero cambiate.
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
